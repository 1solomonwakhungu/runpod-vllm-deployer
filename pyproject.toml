[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "runpod-vllm-deployer"
description = "A safe Python CLI for deploying OpenAI-compatible vLLM servers on RunPod GPUs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Solomon Wakhungu" }]
version = "0.1.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
runpod-vllm = "runpod_vllm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_vllm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=runpod_vllm --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/runpod_vllm/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
