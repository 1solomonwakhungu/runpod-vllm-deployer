[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "runpod-vllm-deployer"
description = "A safe Python CLI for deploying OpenAI-compatible vLLM servers on RunPod GPUs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Solomon Wakhungu" }]
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "python-semantic-release>=10.5,<11",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/1solomonwakhungu/runpod-vllm-deployer"
Repository = "https://github.com/1solomonwakhungu/runpod-vllm-deployer"
Issues = "https://github.com/1solomonwakhungu/runpod-vllm-deployer/issues"
Changelog = "https://github.com/1solomonwakhungu/runpod-vllm-deployer/blob/main/CHANGELOG.md"

[project.scripts]
runpod-vllm = "runpod_vllm.cli:app"

[tool.hatch.version]
path = "src/runpod_vllm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_vllm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=runpod_vllm --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/runpod_vllm/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.semantic_release]
# src/runpod_vllm/__init__.py is the only place the version is written down;
# hatchling reads it from there at build time ([tool.hatch.version]).
version_variables = ["src/runpod_vllm/__init__.py:__version__"]
commit_parser = "conventional"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}\n\nAutomated release via python-semantic-release"
# Stay on 0.x until a 1.0.0 is cut on purpose: without these two settings the
# first release would be 1.0.0, and a breaking change would bump the major.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_types = ["feat", "fix", "docs", "chore", "refactor", "test", "ci", "perf", "style", "build"]
